spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/geoconnect_db
    driver-class-name: org.postgresql.Driver
    username: geoconnect_user
    password: geoconnect_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: geoconnect