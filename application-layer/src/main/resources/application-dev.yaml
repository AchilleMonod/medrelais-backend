spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medrelais_db
    driver-class-name: org.postgresql.Driver
    username: medrelais_user
    password: medrelais_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: medrelais